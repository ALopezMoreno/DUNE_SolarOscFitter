# Step 4: 2D likelihood scans, no sampling, over the region of the default corner plot
# (sin²θ₁₃: the reactor prior ± 4σ). The nuisances that matter most (Fisher share ≥ 0.1, at most
# 4) are marginalised at each grid point by the Laplace approximation, so the contours have the
# width of the posterior. About 10 min on 4 threads.
#   julia -t auto --project src/readConfig.jl tutorial_example/05_llh_scan.yaml
#   python3 utils/plotLLH.py outputs/tutorial/scan          # → images/scan_llh.pdf
base: configs/tutorial.yaml

outFile: "outputs/tutorial/scan"
RunMode: "LLH"
llh_bins: 15
nuisance: {}
llh_range_sin2_th12: [0.23, 0.43]
llh_range_sin2_th13: [0.0192, 0.0248]
llh_range_dm2_21: [2.0e-5, 1.4e-4]
