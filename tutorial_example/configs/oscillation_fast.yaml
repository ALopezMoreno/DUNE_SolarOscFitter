# Fast, approximate oscillation calculation for test fits (about 1e-2 precision; accuracy and
# speed in tutorial_example/README.md). Add it to the base: list of any run config.
#
# The legacy night calculation samples P_1e at one or two paths per cos z bin and two energies
# per E_true bin instead of averaging over the bin. E_true is not coarsened further because it
# also bins the cross sections and the detector response.

nightOsc: false
ad_backend: "ForwardDiff"   # the legacy calculation has no Enzyme rule
nBins_Etrue: 30
nBins_cosz: 10
nBins_cosz_fine: 0
